name: syspass-demo

services:
  db:
    image: mariadb:10.3
    container_name: ${DB_CONTAINER_NAME:-syspass-uw-db}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS:?DB_PASS is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql

  app:
    image: ${PHP_IMAGE:-php-testing-composer:latest}
    container_name: ${APP_CONTAINER_NAME:-syspass-uw-app}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: ${REPO_ROOT:?REPO_ROOT is required; run through scripts/setup-demo.sh}
    environment:
      HOME: /tmp
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-}
    volumes:
      - ${REPO_ROOT:?REPO_ROOT is required}:${REPO_ROOT:?REPO_ROOT is required}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - php
      - -d
      - session.save_path=/tmp
      - -d
      - upload_tmp_dir=/tmp
      - -d
      - error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
      - -S
      - 0.0.0.0:8080
      - -t
      - ${REPO_ROOT:?REPO_ROOT is required}
      - tests/ui/server/router.php

volumes:
  db-data:
