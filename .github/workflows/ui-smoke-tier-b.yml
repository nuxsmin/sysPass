name: UI Smoke Tier B

# Tier B has its own daily observation history. It is a separate workflow so a
# Tier B failure (or a skipped Tier B history) can never replace, hide or gate
# the Tier A check. It remains annotation-only until #2086 independently
# qualifies Tier B and a maintainer explicitly promotes it.
#
# The pipeline, budgets and evidence upload live in the shared reusable
# runner (.github/workflows/ui-smoke-run.yml). This caller only keeps the
# triggers, the execution switch and the stable check name.
on:
  workflow_dispatch:
  schedule:
    # Once a day against master, independent of the Tier A schedule.
    - cron: '47 4 * * *'

permissions:
  contents: read

jobs:
  ui-tier-b-work:
    name: UI Smoke (Tier B) workload
    # TESTS_UI_TIER_B_ENABLED is an execution switch for this history only. It
    # is not a merge gate and never controls Tier A. An unset or non-true value
    # skips this workflow without producing Tier B evidence. The shared
    # runner's TESTS_UI_ENABLED is literal there; it is not a second gate.
    if: ${{ vars.TESTS_UI_TIER_B_ENABLED == 'true' }}
    uses: ./.github/workflows/ui-smoke-run.yml
    permissions:
      contents: read
    with:
      tier: B

  # A real Tier B failure must keep a failed job conclusion. The shared runner
  # emits route annotations but never turns the failed exit into a pass. This
  # mirror keeps the stable check name and is not merge-required.
  ui-tier-b:
    name: UI Smoke (Tier B, annotation-only)
    needs: ui-tier-b-work
    if: ${{ always() && vars.TESTS_UI_TIER_B_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the shared runner to succeed
        env:
          WORK_RESULT: ${{ needs['ui-tier-b-work'].result }}
        run: |
          set -euo pipefail
          test "$WORK_RESULT" = "success"
