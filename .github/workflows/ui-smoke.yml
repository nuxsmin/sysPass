name: UI Smoke

# This workflow is intentionally isolated so the daily schedule can only run
# the UI observation job. It must not be merged into feature.yaml, whose other
# jobs already have their own triggers and database provisioning.
on:
  pull_request:
    branches: [ master, 'feat/*' ]
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      diagnostic_retry:
        description: 'Allow one diagnostic retry; a retry-success run is flaky and cannot be complete Tier A'
        type: boolean
        default: false
  schedule:
    # Once a day against master. The checkout step pins the scheduled ref
    # explicitly instead of relying on the runner's default branch.
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  ui:
    name: UI Smoke (Tier A)
    # TESTS_UI_ENABLED is an execution switch only. It is not a merge gate.
    # An unset or non-true value skips the job without producing Tier A
    # evidence, so a skip must never be read as a qualified observation.
    if: ${{ vars.TESTS_UI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Tier A failures must fail this check. Required-check promotion is a
    # separate maintainer operation and is not implied by this setting.
    continue-on-error: false
    env:
      TESTS_UI_ENABLED: ${{ vars.TESTS_UI_ENABLED }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tests/ui/.browsers
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          # Scheduled runs always observe master, even if the default branch
          # changes. Other events keep their own ref (merge ref for PRs).
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref }}

      - name: Record observed commit and setup start
        timeout-minutes: 2
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          echo "UI smoke observed commit: $commit ($branch)"
          {
            echo "## UI smoke observed commit"
            echo ""
            echo "- Commit: \`$commit\`"
            echo "- Branch: \`$branch\`"
            echo "- Event: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "UI_SMOKE_SETUP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo "UI_SMOKE_SETUP_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root assets
        timeout-minutes: 10
        run: npm ci

      - name: Build assets
        timeout-minutes: 10
        run: bash scripts/build-assets.sh

      - name: Setup locale
        timeout-minutes: 3
        run: sudo locale-gen en_US.UTF-8

      - name: Build and verify the PHP 8.3 test image
        timeout-minutes: 25
        run: |
          set -euo pipefail
          docker build \
            --build-arg "COMPOSER_VERSION=2.7" \
            --tag php-testing-composer:latest \
            --file scripts/docker/Dockerfile.php-testing \
            scripts/docker
          docker run --rm --entrypoint php php-testing-composer:latest -r \
            'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 ? 0 : 1);'
          docker run --rm --entrypoint php php-testing-composer:latest -v

      - name: Pull disposable MariaDB 10.3
        timeout-minutes: 10
        run: docker pull mariadb:10.3

      - name: Install Composer dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            php-testing-composer:latest \
            php /usr/bin/composer install \
              --prefer-dist --no-interaction --no-plugins --no-scripts

      - name: Install locked UI harness and pinned Chromium
        timeout-minutes: 15
        working-directory: tests/ui
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          ./node_modules/.bin/playwright install --with-deps chromium

      # The runner owns an independent MariaDB 10.3 container on a run-owned
      # network. It never reuses the integration job's service or schema, and
      # sp:install creates the unique database. No MYSQL_DATABASE is set.
      - name: Run Tier A UI smoke
        timeout-minutes: 20
        env:
          SP_UI_SUMMARY_DIR: ${{ runner.temp }}/ui-summaries
          # Default CI retries stay at zero. A workflow_dispatch operator may
          # explicitly opt in to one diagnostic retry; failOnFlakyTests still
          # rejects a retry-success as complete Tier A evidence.
          SP_UI_DIAGNOSTIC_RETRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostic_retry) && '1' || '0' }}
        run: bash scripts/ui-smoke.sh

      # AC6 bounds setup separately from the spec budget and the job deadline.
      # The runner writes UI_SMOKE_SPECS_STARTED_MS after provisioning (DB start,
      # sp:install, seeding and web readiness) and immediately before Playwright,
      # so this guard measures the real setup window. The shared script fails
      # closed for missing, empty, non-numeric, negative, zero or reversed
      # stamps and for an over-budget window. ci-report repeats the same
      # validation on the retained evidence, so the budget failure is also a
      # non-pass observation.
      - name: Enforce setup budget
        if: always()
        timeout-minutes: 1
        env:
          UI_SMOKE_SETUP_BUDGET_SECONDS: '1800'
        run: bash scripts/ci/check-setup-budget.sh

      # A failure or cancellation in any pre-run step (npm ci, assets, image
      # build, Composer, UI harness, or the runner itself) must still leave
      # sanitized evidence. The helper leaves a complete runner-retained set
      # untouched, repairs a partial set that still has its authoritative
      # summary, and otherwise fails closed with a setup-failed set so
      # ci-report sees one summary.
      - name: Record pre-run setup-failure evidence
        if: cancelled() || failure()
        timeout-minutes: 3
        env:
          SP_UI_SUMMARY_DIR: ${{ runner.temp }}/ui-summaries
          SP_UI_SETUP_ERROR: UI smoke workflow failed before the runner retained Playwright evidence.
        run: |
          set -euo pipefail
          source scripts/lib/ui-smoke-report.sh
          started_at="${UI_SMOKE_SETUP_STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          run_id="ui-smoke.ci-setup-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          ui_smoke_ci_setup_report "$SP_UI_SUMMARY_DIR" "$PWD/tests/ui" "$run_id" "$started_at"

      - name: Evaluate Tier A evidence and budget
        if: always()
        timeout-minutes: 3
        env:
          SP_UI_SUMMARY_DIR: ${{ runner.temp }}/ui-summaries
        run: |
          node tests/ui/src/ci-report.mjs \
            --summaries "$SP_UI_SUMMARY_DIR" \
            --budget-seconds 300 \
            --setup-budget-seconds 1800 \
            --setup-started-ms "${UI_SMOKE_SETUP_STARTED_MS:-}" \
            --setup-finished-ms "${UI_SMOKE_SPECS_STARTED_MS:-}"

      # Fail before publishing when the retained set is empty, duplicated or
      # partial, or when upload-manifest.json lists an entry outside the
      # explicit allowlist. The upload below is an explicit allowlist, never
      # the directory.
      - name: Verify retained evidence set
        id: verify_evidence
        if: always()
        timeout-minutes: 3
        env:
          SP_UI_SUMMARY_DIR: ${{ runner.temp }}/ui-summaries
        run: |
          set -euo pipefail
          source scripts/lib/ui-smoke-report.sh
          ui_smoke_verify_single_summary_root "$SP_UI_SUMMARY_DIR"

      # Only the runner's retained allowlist is published: run-summary.json,
      # junit.xml, upload-manifest.json and allowlisted failed-attempt evidence
      # from #2081. Verification also checks the manifest against this same
      # allowlist. A missing set fails instead of silently publishing nothing.
      # Upload is gated on verification success, not on the earlier steps: a
      # genuine Tier A test failure still has a complete verified set and is
      # published, while a duplicate or partial set is never published.
      - name: Publish sanitized Tier A evidence
        if: always() && steps.verify_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-tier-a-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-summaries/*/run-summary.json
            ${{ runner.temp }}/ui-summaries/*/junit.xml
            ${{ runner.temp }}/ui-summaries/*/upload-manifest.json
            ${{ runner.temp }}/ui-summaries/*/failures/**/screenshot.png
            ${{ runner.temp }}/ui-summaries/*/failures/**/console.log
            ${{ runner.temp }}/ui-summaries/*/failures/**/failure.json
          if-no-files-found: error
          retention-days: 90
